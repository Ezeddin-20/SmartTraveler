<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Traveler – المتجول الذكي</title>
<meta name="description" content="المتجول الذكي – تطبيق ملاحة صوتي للمكفوفين وضعاف البصر على أندرويد. Smart Traveler – a talking navigation app for blind and visually impaired people on Android.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230F3460'/%3E%3Cpath d='M50 18a24 24 0 0 0-24 24c0 18 24 40 24 40s24-22 24-40a24 24 0 0 0-24-24zm0 33a9 9 0 1 1 0-18 9 9 0 0 1 0 18z' fill='%23FFD600'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #111322; --muted: #474b5e;
    --accent: #0f3460; --accent-text: #ffffff; --border: #d9dce8; --focus: #e94560;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111122; --card: #1a1a2e; --text: #ffffff; --muted: #c9cad6; --accent: #ffd600; --accent-text: #111122; --border: #34364f; --focus: #ffd600; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
    font-size: 18px; line-height: 1.6;
  }
  main { max-width: 580px; margin: 0 auto; padding: 28px 16px 48px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .lang { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 26px; }
  .lang button {
    border: 2px solid var(--border); background: var(--card); color: var(--muted);
    padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 16px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); font-weight: 600; }
  header { text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 22px; background: #0f3460; display: inline-grid; place-items: center; }
  h1 { font-size: 34px; margin: 14px 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 24px; }
  .count { display: inline-block; margin: -8px 0 22px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-size: 16px; }
  .count b { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; text-align: center; }
  .download {
    display: block; width: 100%; padding: 18px; border-radius: 14px;
    background: var(--accent); color: var(--accent-text); font-size: 21px; font-weight: 700;
    text-decoration: none;
  }
  .meta { color: var(--muted); font-size: 16px; margin-top: 10px; }
  #qr { display: inline-block; background: #fff; padding: 12px; border-radius: 12px; margin: 16px 0 4px; }
  #qr img, #qr canvas { display: block; }
  h2 { font-size: 22px; margin: 34px 0 10px; }
  ol { padding-inline-start: 24px; margin: 0; }
  ol li { margin: 8px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0; }
  .feature { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .feature h3 { font-size: 18px; margin: 0 0 2px; }
  .feature p { color: var(--muted); font-size: 16px; margin: 0; }
  .telegram { margin-top: 34px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px 24px; text-align: center; }
  .telegram h2 { margin-top: 0; }
  .telegram p { color: var(--muted); margin: 0 0 16px; }
  footer { text-align: center; color: var(--muted); font-size: 15px; margin-top: 40px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="ar" lang="ar">العربية</button>
    <button type="button" data-lang="en" lang="en">English</button>
    <button type="button" data-lang="fr" lang="fr">Français</button>
    <button type="button" data-lang="de" lang="de">Deutsch</button>
  </nav>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 100 100"><path d="M50 12a28 28 0 0 0-28 28c0 21 28 48 28 48s28-27 28-48a28 28 0 0 0-28-28zm0 38a10 10 0 1 1 0-20 10 10 0 0 1 0 20z" fill="#FFD600"/></svg>
    </div>
    <h1 data-t="name"></h1>
    <p class="tagline" data-t="tagline"></p>
    <p class="count" id="count" hidden></p>
  </header>
  <section class="card" aria-labelledby="mainLink">
    <!-- Android: the download itself -->
    <div id="android" hidden>
      <a class="download" id="mainLink" data-t="download"></a>
      <div class="meta" id="mainMeta"></div>
    </div>
    <!-- Anything else: direct download plus a QR code to open the page on a phone -->
    <div id="other" hidden>
      <a class="download" id="desktopLink" data-t="download"></a>
      <div class="meta" id="desktopMeta"></div>
      <p data-t="openOnPhone"></p>
      <div id="qr" aria-hidden="true"></div>
      <div class="meta" data-t="scan"></div>
    </div>
  </section>
  <h2 data-t="installTitle"></h2>
  <ol>
    <li data-t="step1"></li>
    <li data-t="step2"></li>
    <li data-t="step3"></li>
    <li data-t="step4"></li>
  </ol>
  <h2 data-t="featuresTitle"></h2>
  <ul class="grid" id="features"></ul>
  <section class="telegram" aria-labelledby="tgTitle">
    <h2 id="tgTitle" data-t="tgTitle"></h2>
    <p data-t="tgText"></p>
    <a class="download" href="https://t.me/EzTechApps" data-t="tgButton"></a>
  </section>
  <footer data-t="footer"></footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

      tgTitle: "انضم إلى قناتي على تيليجرام",

      tgButton: "الانضمام إلى القناة",
      featuresTitle: "ماذا يفعل المتجول الذكي؟",
      features: [
        ["أين أنا", "يصف موقعك بالتفصيل: الشارع الذي أنت فيه، وأقرب تقاطع، وما حولك."],
        ["حولي وما أمامي", "يصف التقاطع القريب منك وما على يمينك ويسارك، وما ينتظرك أمامك."],
        ["ملاحة خطوة بخطوة", "ابحث عن مكان، والتطبيق يوصلك إليه بالصوت."],
        ["بدون إنترنت", "حمّل خريطة ما حولك أو مدينتك أو دولتك مسبقاً، واستخدم التطبيق دون اتصال."],
        ["تنبيهات العوائق", "ينبّهك إلى المطبات وحواف الرصيف والنزلات عند المعابر."],
        ["مساراتك", "سجّل مساراً وأنت تمشي، وأعد تشغيله متى شئت."],
        ["شوارع تسمّيها بنفسك", "شارع بلا اسم على الخريطة؟ سمّه وأنت تمشي عليه."],

        ["مشاركة موقعك", "أرسل مكانك لمن تريد برسالة."],
        ["إيماءات مخصّصة", "اربط الأوامر التي تستخدمها كثيراً بإيماءات سريعة."],
        ["لضعاف البصر", "تباين عالٍ، وخط كبير، وأزرار بدون رموز."],
        ["أربع لغات", "العربية والإنجليزية والفرنسية والألمانية، مع تحديثات تلقائية."],
      ],
      version: "الإصدار",
      downloads: n => `<b>${n.toLocaleString("ar")}</b> تنزيل`,
      footer: "تطوير عز الدين",
    },
    en: {
      name: "Smart Traveler",
      tagline: "A talking navigation app for blind and visually impaired people: it describes what's around you and guides you to your destination, even without internet.",
      download: "Download Smart Traveler",
      forPhones: "For Android phones",
      openOnPhone: "Or open this page directly on your phone:",
      scan: "Scan with your phone's camera",
      installTitle: "How to install",
      step1: "Tap the download button and wait until it finishes.",
      step2: "Open the file. If your phone asks, allow “Install from this source”.",
      step3: "If a Google Play Protect message says the app is unknown or suggests scanning it, that is normal: the app doesn't come from the Google Play Store. It is safe and free: tap “More details”, then “Install anyway”.",
      step4: "Tap “Install”. Future updates arrive inside the app automatically.",
      tgTitle: "Join my Telegram channel",
      tgText: "Suggest new apps, download all my apps and get the updates first.",
      tgButton: "Join the channel",
      featuresTitle: "What does Smart Traveler do?",
      features: [
        ["Where am I", "Describes your position in detail: the street you're on, the nearest crossing and what's around you."],
        ["Around me and ahead", "Describes the nearby crossing, what's on your right and left, and what lies ahead."],
        ["Step-by-step navigation", "Search for a place and the app guides you there by voice."],
        ["Without internet", "Download the map around you, of your city or your country, and use the app offline."],
        ["Hazard alerts", "Warns you of speed bumps, kerbs and lowered kerbs at crossings."],
        ["Your routes", "Record a route while you walk and play it back any time."],
        ["Streets you name", "A street without a name on the map? Name it while you walk along it."],
        ["Live compass", "Know your direction at any moment."],
        ["Share your location", "Send your position to anyone in a message."],
        ["Custom gestures", "Put the commands you use most on quick gestures."],
        ["For low vision", "High contrast, large text and buttons without emojis."],
        ["Four languages", "Arabic, English, French and German, with automatic updates."],
      ],
      version: "Version",
      downloads: n => `<b>${n.toLocaleString("en")}</b> downloads`,
      footer: "Developed by Ez Eddin",
    },
    fr: {
      name: "Smart Traveler",
      tagline: "Une application de navigation vocale pour les personnes aveugles et malvoyantes : elle décrit ce qui vous entoure et vous guide jusqu'à votre destination, même sans internet.",
      download: "Télécharger Smart Traveler",
      forPhones: "Pour téléphones Android",
      openOnPhone: "Ou ouvrez cette page directement sur votre téléphone :",
      scan: "Scannez avec l'appareil photo du téléphone",
      installTitle: "Comment l'installer",
      step1: "Appuyez sur le bouton de téléchargement et attendez la fin.",
      step2: "Ouvrez le fichier. Si le téléphone le demande, autorisez « Installer depuis cette source ».",
      step3: "Si un message de Google Play Protect dit que l'application est inconnue ou propose de l'analyser, c'est normal : l'application ne vient pas du Google Play Store. Elle est sûre et gratuite : appuyez sur « Plus de détails », puis sur « Installer quand même ».",
      step4: "Appuyez sur « Installer ». Les prochaines mises à jour arrivent automatiquement dans l'application.",
      tgTitle: "Rejoignez ma chaîne Telegram",
      tgText: "Proposez de nouvelles applications, téléchargez toutes mes applications et recevez les mises à jour en premier.",
      tgButton: "Rejoindre la chaîne",
      featuresTitle: "Que fait Smart Traveler ?",
      features: [
        ["Où suis-je", "Décrit votre position en détail : la rue où vous êtes, le carrefour le plus proche et ce qui vous entoure."],
        ["Autour de moi et devant", "Décrit le carrefour proche, ce qui est à votre droite et à votre gauche, et ce qui vous attend devant."],
        ["Navigation pas à pas", "Cherchez un lieu et l'application vous y guide à la voix."],
        ["Sans internet", "Téléchargez la carte autour de vous, de votre ville ou de votre pays, et utilisez l'application hors ligne."],
        ["Alertes d'obstacles", "Vous prévient des ralentisseurs, bordures et abaissements de trottoir aux passages."],
        ["Vos itinéraires", "Enregistrez un itinéraire en marchant et rejouez-le quand vous voulez."],
        ["Rues que vous nommez", "Une rue sans nom sur la carte ? Nommez-la en la parcourant."],
        ["Boussole en direct", "Connaissez votre direction à tout moment."],
        ["Partager votre position", "Envoyez votre position à qui vous voulez par message."],
        ["Gestes personnalisés", "Placez les commandes que vous utilisez le plus sur des gestes rapides."],
        ["Pour les malvoyants", "Contraste élevé, grand texte et boutons sans émojis."],
        ["Quatre langues", "Arabe, anglais, français et allemand, avec mises à jour automatiques."],
      ],
      version: "Version",
      downloads: n => `<b>${n.toLocaleString("fr")}</b> téléchargements`,
      footer: "Développé par Ez Eddin",
    },
    de: {
      name: "Smart Traveler",
      tagline: "Eine sprechende Navigations-App für blinde und sehbehinderte Menschen: Sie beschreibt, was um dich herum ist, und führt dich ans Ziel, auch ohne Internet.",
      download: "Smart Traveler herunterladen",
      forPhones: "Für Android-Handys",
      openOnPhone: "Oder öffne diese Seite direkt auf deinem Handy:",
      scan: "Mit der Handy-Kamera scannen",
      installTitle: "So installierst du es",
      step1: "Tippe auf den Download-Knopf und warte, bis er fertig ist.",
      step2: "Öffne die Datei. Falls das Handy fragt, erlaube „Aus dieser Quelle installieren“.",
      step3: "Wenn eine Meldung von Google Play Protect sagt, die App sei unbekannt, oder einen Scan vorschlägt, ist das normal: Die App kommt nicht aus dem Google Play Store. Sie ist sicher und kostenlos: Tippe auf „Weitere Details“ und dann auf „Trotzdem installieren“.",
      step4: "Tippe auf „Installieren“. Künftige Updates kommen automatisch in der App.",
      tgTitle: "Tritt meinem Telegram-Kanal bei",
      tgText: "Schlag neue Apps vor, lade alle meine Apps herunter und bekomm die Updates als Erste:r.",
      tgButton: "Dem Kanal beitreten",
      featuresTitle: "Was kann Smart Traveler?",
      features: [
        ["Wo bin ich", "Beschreibt deine Position genau: die Straße, auf der du bist, die nächste Kreuzung und was um dich herum ist."],
        ["Um mich herum und vor mir", "Beschreibt die nahe Kreuzung, was rechts und links von dir ist und was vor dir liegt."],
        ["Navigation Schritt für Schritt", "Such einen Ort, und die App führt dich per Sprache hin."],
        ["Ohne Internet", "Lade die Karte rund um dich, deiner Stadt oder deines Landes vorab und nutze die App offline."],
        ["Hinweise auf Hindernisse", "Warnt dich vor Bodenschwellen, Bordsteinen und Absenkungen an Überwegen."],
        ["Deine Routen", "Zeichne beim Gehen eine Route auf und spiel sie jederzeit wieder ab."],
        ["Straßen, die du benennst", "Eine Straße ohne Namen auf der Karte? Benenne sie, während du sie entlanggehst."],
        ["Live-Kompass", "Kenne jederzeit deine Richtung."],
        ["Standort teilen", "Schick deine Position per Nachricht, an wen du willst."],
        ["Eigene Gesten", "Leg die Befehle, die du am meisten nutzt, auf schnelle Gesten."],
        ["Für Sehbehinderte", "Hoher Kontrast, große Schrift und Tasten ohne Emojis."],
        ["Vier Sprachen", "Arabisch, Englisch, Französisch und Deutsch, mit automatischen Updates."],
      ],
      version: "Version",
      downloads: n => `<b>${n.toLocaleString("de")}</b> Downloads`,
      footer: "Entwickelt von Ez Eddin",
    },
  };

  const isAndroid = /android/i.test(navigator.userAgent);
  let lang = "ar";
  let release = null;          // { tag, size } of the newest release
  let totalDownloads = null;   // over all releases

  const mb = bytes => (bytes / 1048576).toFixed(1).replace(/\.0$/, "") + " MB";

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
    const grid = document.getElementById("features");
    grid.replaceChildren(...t.features.map(([title, text]) => {
      const li = document.createElement("li");
      li.className = "feature";
      li.append(Object.assign(document.createElement("h3"), { textContent: title }),
                Object.assign(document.createElement("p"), { textContent: text }));
      return li;
    }));
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

    const count = document.getElementById("count");
    count.hidden = totalDownloads === null;
    if (totalDownloads !== null) count.innerHTML = t.downloads(totalDownloads);

    const info = [t.forPhones, release && `${t.version} ${release.tag}`, release?.size && mb(release.size)].filter(Boolean).join(" · ");
    for (const id of ["mainLink", "desktopLink"]) document.getElementById(id).href = APK_URL;
    document.getElementById("mainMeta").textContent = info;
    document.getElementById("desktopMeta").textContent = info;
  }

  function pickLanguage() {
    try {
      const saved = localStorage.getItem("lang");
      if (saved && T[saved]) return saved;
    } catch (_) {}
    const nav = (navigator.language || "ar").slice(0, 2);
    return T[nav] ? nav : "en";
  }

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (_) {}
    render();
  }));

  (async () => {
    lang = pickLanguage();
    document.getElementById(isAndroid ? "android" : "other").hidden = false;
    if (!isAndroid && window.QRCode) new QRCode(document.getElementById("qr"), { text: location.href, width: 180, height: 180 });
    render();
    try {
      // One request gives both: the newest release (list is newest first) and all download counts.
      const res = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`);
      if (res.ok) {
        const all = (await res.json()).filter(r => !r.draft && !r.prerelease);
        totalDownloads = all.flatMap(r => r.assets).reduce((sum, a) => sum + a.download_count, 0);
        const latest = all[0];
        const apk = latest?.assets.find(a => a.name === APK);
        if (latest) release = { tag: latest.tag_name.replace(/^v/i, ""), size: apk?.size };
        render();
      }
    } catch (_) { /* offline or rate-limited: the link still works, just no version/size */ }
  })();
</script>
</body>
</html>
